name: ai-rag-platform

services:
  web:
    build: ../../apps/web
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_started

  api-gateway:
    build: ../../services/api-gateway
    ports:
      - "8000:8000"
    environment:
      AGENT_SERVICE_URL: http://agent:8001
      AGENT_REQUEST_TIMEOUT_SECONDS: 10
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      agent:
        condition: service_started

  agent:
    build: ../../services/agent
    ports:
      - "8001:8001"
    environment:
      RETRIEVAL_SERVICE_URL: http://retrieval:8002
      RETRIEVAL_REQUEST_TIMEOUT_SECONDS: 5
      INFERENCE_SERVICE_URL: http://inference:8003
    depends_on:
      retrieval:
        condition: service_started
      inference:
        condition: service_started

  retrieval:
    build: ../../services/retrieval
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://rag_platform:local-development-only@postgres:5432/rag_platform
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  inference:
    build: ../../services/inference
    ports:
      - "8003:8003"
    environment:
      INFERENCE_BACKEND: vllm
      VLLM_BASE_URL: http://host.docker.internal:8004

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag_platform
      POSTGRES_USER: rag_platform
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_platform -d rag_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
