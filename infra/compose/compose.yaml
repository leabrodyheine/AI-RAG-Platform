name: ai-rag-platform

services:
  web:
    build: ../../apps/web
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_started

  api-gateway:
    build: ../../services/api-gateway
    ports:
      - "8000:8000"
    environment:
      AGENT_SERVICE_URL: http://agent:8001
      AGENT_REQUEST_TIMEOUT_SECONDS: 10
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    depends_on:
      agent:
        condition: service_started
      otel-collector:
        condition: service_started

  agent:
    build: ../../services/agent
    ports:
      - "8001:8001"
    environment:
      RETRIEVAL_SERVICE_URL: http://retrieval:8002
      RETRIEVAL_REQUEST_TIMEOUT_SECONDS: 5
      INFERENCE_SERVICE_URL: http://inference:8003
      INFERENCE_REQUEST_TIMEOUT_SECONDS: 15
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    depends_on:
      retrieval:
        condition: service_healthy
      inference:
        condition: service_healthy
      otel-collector:
        condition: service_started

  retrieval:
    build: ../../services/retrieval
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://rag_platform:local-development-only@postgres:5432/rag_platform
      REDIS_URL: redis://redis:6379/0
      RETRIEVAL_CACHE_TTL_SECONDS: 60
      EMBEDDING_PROVIDER: fastembed
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      EMBEDDING_MODEL_VERSION: fastembed:BAAI/bge-small-en-v1.5:v1
      EMBEDDING_CACHE_DIR: /home/appuser/.cache/fastembed
      ORT_DISABLE_TELEMETRY: 1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    volumes:
      - embedding-cache:/home/appuser/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  inference:
    build: ../../services/inference
    ports:
      - "8003:8003"
    environment:
      # The default stack is CPU-only. To compare a GPU backend, start a server
      # per runtimes/ and override these (configuration only, no code change):
      #   INFERENCE_BACKEND: vllm
      #   INFERENCE_MODEL: meta-llama/Llama-3.1-8B-Instruct
      #   VLLM_BASE_URL: http://host.docker.internal:8000
      # or INFERENCE_BACKEND: triton / INFERENCE_MODEL: ensemble /
      #   TRITON_BASE_URL: http://host.docker.internal:8000
      INFERENCE_BACKEND: deterministic
      INFERENCE_MODEL: deterministic-grounded-v1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector:0.116.0
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ../observability/otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "4318:4318"
      - "4317:4317"

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api-gateway
      - agent
      - retrieval
      - inference

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag_platform
      POSTGRES_USER: rag_platform
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_platform -d rag_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  embedding-cache:
  postgres-data:
  grafana-data:
