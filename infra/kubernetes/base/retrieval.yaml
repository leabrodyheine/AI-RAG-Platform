apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval
  labels:
    app.kubernetes.io/name: retrieval
    app.kubernetes.io/component: retrieval
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: retrieval
  template:
    metadata:
      labels:
        app.kubernetes.io/name: retrieval
        app.kubernetes.io/component: retrieval
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: retrieval
          image: ai-rag-platform/retrieval:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: rag-platform-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-platform-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: rag-platform-secrets
                  key: postgres-db
            # Assembled from the Secret values above; the password never appears
            # in a ConfigMap or in this manifest.
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          envFrom:
            - configMapRef:
                name: rag-platform-config
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: retrieval
spec:
  selector:
    app.kubernetes.io/name: retrieval
  ports:
    - name: http
      port: 8002
      targetPort: http
