# Local-development credentials ONLY. These match the throwaway values the
# Compose stack already commits (infra/compose/compose.yaml) so a kind or
# Minikube apply works out of the box. Real deployments must NOT use this file:
# replace it with a Secret injected from a secrets manager (External Secrets,
# Sealed Secrets, SOPS, cloud KMS) and keep the real values out of Git.
apiVersion: v1
kind: Secret
metadata:
  name: rag-platform-secrets
type: Opaque
stringData:
  postgres-user: "rag_platform"
  postgres-password: "local-development-only"
  postgres-db: "rag_platform"
