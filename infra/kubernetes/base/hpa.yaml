# Horizontal Pod Autoscalers for the stateless request-path services.
#
# Only the services that do CPU work per request and hold no per-pod state are
# autoscaled:
#   - api-gateway  fan-out proxy, one goroutine-equivalent per request
#   - agent        orchestrates retrieval + inference, pure compute + I/O wait
#   - retrieval    embeds the query on the CPU before the vector search
#
# Deliberately NOT autoscaled:
#   - inference    the real backend is a single GPU pod (see overlays/gpu); you
#                  scale that with more GPUs, not with an HPA on CPU.
#   - web          static nginx; CPU per request is negligible, so a CPU target
#                  would never trip. Scale by editing replicas if ever needed.
#   - postgres,    stateful. HPA on a single-writer database or a cache is wrong.
#     redis
#
# The Deployments for the three targets below intentionally omit `replicas` so
# `kubectl apply` does not fight the HPA on every reconcile; the HPA owns the
# count. Requires metrics-server in the cluster (see overlays/local/README.md).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/component: agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: retrieval
  labels:
    app.kubernetes.io/name: retrieval
    app.kubernetes.io/component: retrieval
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: retrieval
  minReplicas: 1
  maxReplicas: 6
  # Query embedding is the CPU cost here; let pods run a little hotter before
  # adding another (each new pod is another Postgres connection pool).
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
      selectPolicy: Max
