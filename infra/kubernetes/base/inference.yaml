apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  labels:
    app.kubernetes.io/name: inference
    app.kubernetes.io/component: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference
        app.kubernetes.io/component: inference
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: inference
          image: ai-rag-platform/inference:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8003
          env:
            - name: INFERENCE_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: rag-platform-config
                  key: INFERENCE_BACKEND
            - name: INFERENCE_MODEL
              valueFrom:
                configMapKeyRef:
                  name: rag-platform-config
                  key: INFERENCE_MODEL
            - name: OTEL_SDK_DISABLED
              valueFrom:
                configMapKeyRef:
                  name: rag-platform-config
                  key: OTEL_SDK_DISABLED
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: inference
spec:
  selector:
    app.kubernetes.io/name: inference
  ports:
    - name: http
      port: 8003
      targetPort: http
