# kind cluster for the platform. One node, with the host ports the
# ingress-nginx controller needs mapped through so http://rag-platform.local
# on the host reaches the Ingress.
#
#   kind create cluster --name ai-rag --config infra/kubernetes/overlays/local/kind-cluster.yaml
#
# Then install the controller (kind flavour) and wait for it:
#
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
#   kubectl -n ingress-nginx wait --for=condition=Ready pod \
#     --selector=app.kubernetes.io/component=controller --timeout=180s
#
# Add to /etc/hosts:  127.0.0.1  rag-platform.local
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
