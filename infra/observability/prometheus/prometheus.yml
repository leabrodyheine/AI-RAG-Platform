# Prometheus scrape configuration for the local Compose stack.
# Each application service exposes Prometheus text on /metrics (added by
# rag_observability.instrument_app).

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: agent
    metrics_path: /metrics
    static_configs:
      - targets: ["agent:8001"]

  - job_name: retrieval
    metrics_path: /metrics
    static_configs:
      - targets: ["retrieval:8002"]

  - job_name: inference
    metrics_path: /metrics
    static_configs:
      - targets: ["inference:8003"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
