name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python tests, lint, contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          make install-python
      - name: Lint (ruff)
        run: make lint-python
      - name: Contract schemas
        run: python -m pytest tests/contracts -q
      - name: Unit, integration, and end-to-end tests
        run: make test-python

  web:
    name: Frontend typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (tsc)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm test -- --run
      - name: Production build
        run: npm run build

  manifests:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install script dependencies
        run: pip install -r scripts/requirements.txt
      - name: Install kubectl (built-in kustomize v4)
        run: |
          curl -fsSL -o /tmp/kubectl \
            https://dl.k8s.io/release/v1.25.4/bin/linux/amd64/kubectl
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client
      - name: Render and check every kustomize target
        run: make k8s-validate
