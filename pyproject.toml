[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = [
  "libs/observability/tests",
  "services/api-gateway/tests",
  "services/agent/tests",
  "services/retrieval/tests",
  "services/inference/tests",
  "tests/contracts",
  "tests/integration",
  "evaluation/quality/tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
